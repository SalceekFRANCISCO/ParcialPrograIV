<div class="hangman-container">
    <div class="top-bar">
        <div class="clock-box">
            {{clock}}
        </div>
        <div class="lives-box">
            {{lives}} vidas
        </div>
    </div>

    @if (lives <= 0) {
        <div class="status lose">
            <h2>PERDISTE</h2>
            <p>La palabra era:</p>
            <strong>{{secretWord}}</strong>
        </div>
    }
    @if (!secretWordArray.includes('_')) {
        <div class="status win">
            <h2>GANASTE</h2>
        </div>
    }
    <div class="reset-container">
        <button class="reset-button" (click)="resetGame()">
            Reiniciar
        </button>
    </div>
    <div class="word-container">
        @for(sript of secretWordArray; track $index){
            <button class="button-letter-sript">
                {{sript}}
            </button>
        }
    </div>
    <div class="for">
        @for(letter of ArrayLetter; track $index){
            <button
                class="button-letter"
                [disabled]="usedLetters.has(letter) || gameOver"
                (click)="sendValue(letter.valueOf())"
            >
                {{letter}}
            </button>
        }
    </div>
</div>
